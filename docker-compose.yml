services:
  # =====================================
  # POSTGRESQL
  # =====================================
  db:
    image: postgres:18.1-alpine
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-PjaSistarefas}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    # Porta disponível somente na máquina local.
    # 5433 evita conflito com seu PostgreSQL anterior.
    ports:
      - "127.0.0.1:5433:5432"

    networks:
      - backend


  # =====================================
  # BACKEND
  # =====================================
  api:
    build:
      context: .
      dockerfile: apps/back/Dockerfile

    restart: unless-stopped
    init: true

    environment:
      NODE_ENV: production
      PORT: 3333

      DATABASE_URL: "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-PjaSistarefas}"

      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET}
      ACCESS_TOKEN: ${ACCESS_TOKEN:?Defina ACCESS_TOKEN}

    depends_on:
      db:
        condition: service_healthy

    expose:
      - "3333"

    networks:
      - backend
      - edge


  # =====================================
  # NGINX
  # =====================================
  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped

    ports:
      - "3333:80"

    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      api:
        condition: service_healthy

    networks:
      - edge


# =====================================
# VOLUMES
# =====================================
volumes:
  postgres_data:


# =====================================
# NETWORKS
# =====================================
networks:
  backend:
  edge: